<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'social_media_app/styles.css' %}">
    <link rel= "stylesheet" href= "https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css" >
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>Document</title>
</head>

<div id="gallery_wrapper" class="gallery-container">
    {% for image in images %}
        <img src="{{ image }}" alt="Image" class="centered-image">
    {% endfor %}
</div>

<div class="nav-buttons">
    <a href="{% url 'home' %}" class="button_main">Home</a>
    <button id="prev-btn" class="button_main">Previous</button>
    <button id="next-btn" class="button_main">Next</button>
</div>

<script>
    let currentPage = '{{ images.number }}';

    function render_images(images) {
        const wrapper = document.getElementById('gallery_wrapper');
        wrapper.innerHTML = ''; 
        images.forEach(imgUrl => {
            const img = document.createElement('img');
            img.src = imgUrl;
            img.alt = 'Gallery image';
            img.style.maxWidth = '1050px';
            img.style.margin = '10px';
            wrapper.appendChild(img);
        });
    }

    function load_images(page) {
        fetch(`{% url 'beginning' %}?page=${page}`, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(res => res.json())
        .then(data => {
            render_images(data.images);
            currentPage = page;
            document.getElementById('next-btn').disabled = !data.has_next;
            document.getElementById('prev-btn').disabled = !data.has_previous;
        });
    }

    document.getElementById('next-btn').addEventListener('click', () => {
        load_images(currentPage + 1);
    });

    document.getElementById('prev-btn').addEventListener('click', () => {
        if (currentPage > 1) load_images(currentPage - 1);
    });
</script>
