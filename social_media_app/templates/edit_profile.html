<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'social_media_app/styles.css' %}">
    <title>Document</title>
</head>
<body>
    <div class="center">
    <div class="login_container">
    <h2 style="font-family: 'MyFont', sans-serif;">Edit Profile</h2>
    <form method="post" novalidate enctype="multipart/form-data">
        {% csrf_token %}
        Current avatar: 
        <div class="vertical_form">
            {% if user.profile.avatar %}
                <img src="{{ user.profile.avatar.url }}" width="100">
            {% else %}
                <img src="/static/icons/user.png" class="profile_avatar" />
            {% endif %}
            <div class="mb-3">
                {{ form.avatar }}

            </div>
            <div class="mb-3">
                <div>{{ form.username.label_tag }}</div>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <div>{{ form.bio.label_tag }}</div>
                {{ form.bio }}

            </div>

        
        </div>
        <button type="submit" class="button_main">Save</button>
    </form>
    </div>
    </div>
</body>
</html>
