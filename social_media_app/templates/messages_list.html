<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'social_media_app/styles.css' %}">
    <title>Document</title>
</head>
<body>
    <div class="followers_container">
    {% for user in connections %}
         <div class="follower_item">
            <a href="{% url 'chat_room' user.username %}">
            {% if user.profile.avatar %}
                <img src="{{ user.profile.avatar.url }}" class="avatar">
            {% else %}
                <img src="/static/icons/user.png" class="avatar" />
            {% endif %}
            {% if user and user.username %}
            
            <span style="text-decoration: none !important;">{{ user.username }}</span>
            </a>
            {%endif%}
            </a>
        </div>
    {% endfor %}
    
    </div>
</body>
</html>
